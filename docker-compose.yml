services:
  # --- Database: persistent storage for Strapi (or any app data) ---
  db:
    image: postgres:16-alpine
    container_name: forma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma_password}
      POSTGRES_DB: ${POSTGRES_DB:-forma}
    ports:
      # Exposed for local debugging (psql, pgAdmin). Remove if not needed.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forma} -d $${POSTGRES_DB:-forma}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- CMS (Strapi) - optional, only starts with: docker compose --profile cms up -d ---
  # If your Strapi runs outside Docker (npm run develop), this service is unused.
  # To containerize Strapi, put your Strapi project in ./cms and uncomment build: ./cms,
  # OR use the official image with a mounted volume as below.
  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    image: forma-strapi
    container_name: forma-strapi
    restart: unless-stopped
    profiles: ["cms"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Database – points to the `db` service above
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-forma}
      DATABASE_USERNAME: ${POSTGRES_USER:-forma}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-forma_password}
      DATABASE_SSL: "false"
      # Strapi secrets – from cms/.env but allow override via root .env
      JWT_SECRET: ${JWT_SECRET:-OR+Ew3O3o9OqegZBZSG9Mw==}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-UZzHESUPyOvQjT75lJFYMw==}
      APP_KEYS: ${APP_KEYS:-tLD4pBKcfAZfQ9jFTRFldg==,DJrt3H0XncwGEYjSysI7QQ==,8UjFTAV7RdI+jhzcJVFQ8Q==,yHEFdqkZ6wwTBN2TPJ7+kA==}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-lZZAKQFoFF6T2VC6gbdk+w==}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-WZC3rGqzWJarL7xbgZwx9A==}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZMbZScDzAiayVDML6YamXw==}
      HOST: 0.0.0.0
      PORT: 1337
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    volumes:
      # Only uploads need persistence – code is baked into image
      - strapi_uploads:/opt/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:1337/admin',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: forma-web
    container_name: forma-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Inside Docker network use `http://strapi:1337`, outside/fallback use host.docker.internal
      # When running with --profile cms, web talks to strapi service. Otherwise it falls back to host.
      - STRAPI_URL=${STRAPI_URL:-http://strapi:1337}
      # Image URLs must be reachable by the Next.js image optimizer (runs inside THIS
      # container), so use the Docker-network hostname, not localhost.
      - NEXT_PUBLIC_STRAPI_URL=${NEXT_PUBLIC_STRAPI_URL:-http://strapi:1337}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || node -e \"require('http').get('http://localhost:3000',r=>{if(r.statusCode!==200)process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
    name: forma-postgres-data
  strapi_uploads:
    driver: local
    name: forma-strapi-uploads
